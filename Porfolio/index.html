<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio VSCode - Nahuel</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js"></script>
</head>

<body>
  <div class="vscode-layout">
    <aside class="sidebar">
      <div class="sidebar-icon">📁</div>
      <div class="sidebar-icon">🔍</div>
      <div class="sidebar-icon">🔧</div>
    </aside>

    <section class="explorer">
      <h3>EXPLORADOR</h3>
      <ul class="file-tree">
        <li onclick="buildCurriculumFromJSON()">
          <img src="assets/icons/file-html.svg" class="icon" />
          index.html
        </li>
        <li class="folder" onclick="toggleFolder(this)">
          <img src="assets/icons/folder.svg" class="icon" />
          src
          <ul class="nested">
            <li onclick="openFile('about')">
              <img src="assets/icons/file-md.svg" class="icon" />
              about.md
            </li>
            <li onclick="openFile('projects')">
              <img src="assets/icons/file-js.svg" class="icon" />
              projects.js
            </li>
          </ul>
        </li>
        <li onclick="openFile('README')">
          <img src="assets/icons/file-readme.svg" class="icon" />
          README.md
        </li>
      </ul>
    </section>

    <main class="editor">
      <div class="tabs" id="tabs"></div>
      <div class="editor-body">
        <div class="line-numbers" id="lineNumbers"></div>
        <pre class="code-area" id="codeArea"></pre>
      </div>
    </main>

    <section class="terminal">
      <div class="terminal-header">TERMINAL</div>
      <div class="terminal-body" id="terminal-body">
        <div class="line">> npm start</div>
      </div>
    </section>

    <footer class="statusbar">
      <span>🌐 Español (Latinoamérica)</span>
      <span>🔒 Seguridad técnica activa</span>
    </footer>
  </div>
  <div class="browser-window" id="browserWindow">
    <div class="browser-header">
      <span class="browser-title">index.html - Nahuel CV</span>
      <button onclick="closeBrowserWindow()">✖</button>
    </div>
    <iframe id="browserContent"></iframe>
  </div>
</body>

</html>
