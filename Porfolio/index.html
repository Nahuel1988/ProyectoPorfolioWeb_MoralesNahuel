<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Simulador de Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="vscode-layout">

    <!-- Sidebar lateral estilo VSCode -->
    <aside class="sidebar">
      <button class="sidebar-icon" title="Explorador">
        <img src="assets/icons/files.svg" alt="Explorador" />
      </button>
      <button class="sidebar-icon" title="Buscar">
        <img src="assets/icons/search.svg" alt="Buscar" />
      </button>
      <button class="sidebar-icon" title="Git">
        <img src="assets/icons/github-inverted.svg" alt="Git" />
      </button>
      <button class="sidebar-icon" title="Extensiones">
        <img src="assets/icons/extensions.svg" alt="Extensiones" />
      </button>
      <div class="sidebar-bottom">
        <button class="sidebar-icon" title="Configuración">
          <img src="assets/icons/settings-gear.svg" alt="configuración" />
        </button>
        <button class="sidebar-icon" title="Cuenta">
          <img src="assets/icons/account.svg" alt="cuenta" />
        </button>
      </div>

    </aside>

    <!-- Explorador de archivos -->
    <aside class="explorer">
      <h3>mi-portfolio</h3>
      <ul class="file-tree">
        <li onclick="startSequence()">
          <img src="assets/icons/file-html.svg" class="icon" /> index.html
        </li>
        <li>
          <img src="assets/icons/file-css.svg" class="icon" /> style.css
        </li>
        <li>
          <img src="assets/icons/file-js.svg" class="icon" /> script.js
        </li>
      </ul>
    </aside>

    <!-- Editor central -->
    <main class="editor">
      <div class="tabs" id="tabs"></div>
      <div class="editor-body">
        <div class="line-numbers" id="lineNumbers"></div>
        <pre class="code-area" id="codeArea"></pre>
      </div>
    </main>

    <!-- Barra de estado inferior -->
    <footer class="statusbar">
      <span>🌐 Español (Latinoamérica)</span>
      <span>🔒 Git: main</span>
      <span>⚠️ 0 errores</span>
    </footer>
    <!-- Ventana flotante tipo navegador -->
    <div class="browser-window" id="browserWindow">
      <div class="browser-header">
        <span>index.html</span>
        <button onclick="closeBrowserWindow()">✖</button>
      </div>
      <iframe id="browserContent"></iframe>
    </div>

  </div>
</body>

</html>
