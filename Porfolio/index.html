<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio VSCode</title>
    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/layout.css" />
    <link rel="stylesheet" href="style/sidebar.css" />
    <link rel="stylesheet" href="style/explorer.css" />
    <link rel="stylesheet" href="style/editor.css" />
    <link rel="stylesheet" href="style/terminal.css" />
    <link rel="stylesheet" href="style/browser.css" />
    <link rel="stylesheet" href="style/statusbar.css" />

</head>
<body>
    <header class="topbar">
            <div class="topbar-left">
                <img src="assets/icons/file_type_vscode.svg" class="logo" alt="Logo" />
                <span class="project-name">Porfolio VSCode</span>
            </div>
            <div class="topbar-right">
                <button title="Minimizar">—</button>
                <button title="Expandir">▢</button>
                <button title="Cerrar">✕</button>
            </div>
     </header>


    <div class="vscode-layout">

        <div id="sidebar" class="sidebar"></div>
        
        <div id="explorer" class="explorer"></div>
        <div class="main-area">
            <div class="tabs"></div>
            <div class="code-area"></div>
            <div class="preview">
                <div class="terminal terminal-sim">
                    <pre class="terminal-output"></pre>
                </div>
            </div>
        </div>
        <div id="terminal" class="terminal"></div>

        <div id="statusbar" class="statusbar"></div>
    </div>



</body>

<script type="module" src="scripts/main.js"></script>

</html>
